# =============================================================================
# Validacion independiente de las pruebas unitarias.
#
# Es la pieza que convierte el entorno local en un entorno VALIDADO: el mismo
# gate que ejecuta el agente de IA en la maquina del desarrollador
# (tools/validate-tests.sh) corre aqui sobre una maquina limpia. Si el test
# generado solo pasaba "en local", aqui se cae.
# =============================================================================
name: unit-tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      mutation:
        description: "Ejecutar tambien mutation testing (PIT)"
        type: boolean
        default: false

jobs:
  validate:
    name: Tests unitarios + cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ms-production-packaging

    steps:
      - uses: actions/checkout@v4

      # El build exige Java 21: sin esto falla con "release version 21 not supported"
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar suite unitaria + umbral de cobertura
        run: ./mvnw -B verify

      # Resumen legible en la pestaña Summary del run, sin abrir el log
      - name: Resumen de cobertura
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            {
              echo "## Cobertura (JaCoCo)"
              echo ""
              awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
                       END {printf "| Metrica | Cobertura |\n|---|---|\n| Lineas | %.1f %% (%d/%d) |\n| Ramas | %.1f %% (%d/%d) |\n",
                                   100*lc/(lm+lc), lc, lm+lc, 100*bc/(bm+bc), bc, bm+bc}' "$CSV"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mutation testing (PIT)
        if: inputs.mutation
        run: ./mvnw -B -Djacoco.skip=true test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            ms-production-packaging/target/site/jacoco/
            ms-production-packaging/target/surefire-reports/
            ms-production-packaging/target/pit-reports/
          if-no-files-found: warn
          retention-days: 14
