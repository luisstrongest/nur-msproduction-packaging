spring:
  application:
    name: ms-production-packaging

  # -- Base de datos PostgreSQL ----------------------------------------------
  # Todo lo relacionado con la BD cuelga de 'spring:' (2 espacios de indentacion).
  datasource:
    url: jdbc:postgresql://localhost:5432/nur_prod_db
    username: postgres
    password: S1stemas
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update : crea las tablas que falten y conserva los datos existentes.
      # create : borra y recrea el esquema en cada arranque (util al inicio).
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

server:
  port: 8082

# -- Swagger UI / OpenAPI ------------------------------------------------------
# UI:   http://localhost:8082/swagger-ui.html
# JSON: http://localhost:8082/v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

